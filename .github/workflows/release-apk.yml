name: Build APK and Publish Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set release metadata
        id: meta
        shell: bash
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          SAFE_BRANCH="$(printf '%s' "$BRANCH" | tr '/[:space:]' '-' | tr -cd 'A-Za-z0-9._-')"
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG="${SAFE_BRANCH}-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${SHORT_SHA}"
          RELEASE_NAME="Development Build #${GITHUB_RUN_NUMBER} (${SHORT_SHA})"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"
          echo "asset_name=GitAppStore-${SAFE_BRANCH}-${SHORT_SHA}-run${GITHUB_RUN_NUMBER}.apk" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "run_url=$RUN_URL" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Prepare APK asset
        id: asset
        shell: bash
        env:
          ASSET_NAME: ${{ steps.meta.outputs.asset_name }}
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk "release-assets/${ASSET_NAME}"
          echo "path=release-assets/${ASSET_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_NAME: ${{ steps.meta.outputs.release_name }}
          ASSET_NAME: ${{ steps.meta.outputs.asset_name }}
          APK_PATH: ${{ steps.asset.outputs.path }}
          BRANCH: ${{ steps.meta.outputs.branch }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
          RUN_URL: ${{ steps.meta.outputs.run_url }}
        run: |
          NOTES="$(cat <<EOF
          Automated development build for commit \`${SHORT_SHA}\`.

          - Branch: \`${BRANCH}\`
          - Commit: \`${GITHUB_SHA}\`
          - Run number: \`${GITHUB_RUN_NUMBER}\`
          - Workflow run: ${RUN_URL}

          This prerelease was generated automatically from the latest successful CI build for this run on \`${BRANCH}\`.
          EOF
          )"

          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "$RELEASE_NAME" \
              --notes "$NOTES" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --latest
            gh release upload "$TAG" "$APK_PATH" --clobber
            exit 0
          fi

          gh release create "$TAG" "$APK_PATH" \
            --title "$RELEASE_NAME" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --latest
