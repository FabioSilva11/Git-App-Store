name: Android CI

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - "settings.gradle.kts"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.set_sha.outputs.short_sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Set short SHA
        id: set_sha
        shell: bash
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Rename APK with commit hash
        shell: bash
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/app-debug-${{ steps.set_sha.outputs.short_sha }}.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug-${{ steps.set_sha.outputs.short_sha }}
          path: app/build/outputs/apk/debug/app-debug-${{ steps.set_sha.outputs.short_sha }}.apk

  publishRelease:
    name: Publish APK to GitHub Releases
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: apk-debug-${{ needs.build.outputs.short_sha }}
          path: ./release-assets

      - name: Set release metadata
        id: release_meta
        shell: bash
        run: |
          release_tag="main-build-${{ github.run_id }}-${{ github.run_attempt }}-${{ needs.build.outputs.short_sha }}"
          asset_name="GitAppStore-main-${{ needs.build.outputs.short_sha }}-run${{ github.run_number }}.apk"

          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${asset_name}" >> "$GITHUB_OUTPUT"

          cp ./release-assets/app-debug-${{ needs.build.outputs.short_sha }}.apk \
             "./release-assets/${asset_name}"

      - name: Write release notes
        shell: bash
        run: |
          cat <<EOF > release-notes.md
          Automated development build for commit \`${{ needs.build.outputs.short_sha }}\`.

          - Branch: \`${{ github.ref_name }}\`
          - Commit: \`${{ github.sha }}\`
          - Run number: \`${{ github.run_number }}\`
          - Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

          This release was generated automatically from the latest successful CI build for this run on \`${{ github.ref_name }}\`.
          EOF

      - name: Create release for this build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${{ steps.release_meta.outputs.release_tag }}" \
            -R "${GITHUB_REPOSITORY}" \
            "./release-assets/${{ steps.release_meta.outputs.asset_name }}" \
            --title "Development Build #${{ github.run_number }} (${{ needs.build.outputs.short_sha }})" \
            --notes-file release-notes.md \
            --target "${GITHUB_SHA}" \
            --latest
