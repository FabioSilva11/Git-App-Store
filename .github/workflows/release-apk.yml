name: Build APK and Publish Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release (ex.: v1.0.0)"
        required: true
        type: string
      release_name:
        description: "Nome da release"
        required: false
        type: string
      prerelease:
        description: "Marcar como pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set release metadata
        id: meta
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_RELEASE_NAME: ${{ github.event.inputs.release_name }}
        run: |
          if [ -z "$INPUT_RELEASE_NAME" ]; then
            INPUT_RELEASE_NAME="$INPUT_TAG"
          fi

          echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          echo "release_name=$INPUT_RELEASE_NAME" >> "$GITHUB_OUTPUT"
          echo "asset_name=git-app-store-${INPUT_TAG}-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Prepare APK asset
        id: asset
        shell: bash
        env:
          ASSET_NAME: ${{ steps.meta.outputs.asset_name }}
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk "release-assets/${ASSET_NAME}"
          echo "path=release-assets/${ASSET_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_NAME: ${{ steps.meta.outputs.release_name }}
          APK_PATH: ${{ steps.asset.outputs.path }}
          PRERELEASE: ${{ github.event.inputs.prerelease }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK_PATH" --clobber
            exit 0
          fi

          args=()
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi

          gh release create "$TAG" "$APK_PATH" \
            --title "$RELEASE_NAME" \
            --notes "APK debug gerado automaticamente pelo GitHub Actions." \
            --target "$GITHUB_SHA" \
            "${args[@]}"
